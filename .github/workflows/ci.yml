name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations (offline check)
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_test.db

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/test_logging.py tests/test_agent_tools.py tests/test_health.py -v

  eval:
    runs-on: ubuntu-latest
    needs: test
    # Run only on direct pushes to main or manual dispatch — not on PRs,
    # to avoid spending Groq quota on every branch push.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DATABASE_URL: sqlite:///./dentalai.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Seed database
        working-directory: backend
        run: python -m app.db.seed

      - name: Notice — eval skipped (no API key)
        if: env.GROQ_API_KEY == ''
        run: echo "::notice::GROQ_API_KEY is not set — eval step was skipped; no evals ran this run"

      - name: Run eval harness (gate at 80%)
        if: env.GROQ_API_KEY != ''
        working-directory: backend
        run: python evals/run_evals.py --fail-under 80 --delay 2.0
