name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations (offline check)
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_test.db

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/test_logging.py tests/test_agent_tools.py tests/test_health.py -v

  eval:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.GROQ_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Seed database
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.db.seed
        env:
          DATABASE_URL: sqlite:///./dentalai.db

      - name: Run eval harness (gate at 80%)
        working-directory: backend
        run: python evals/run_evals.py --fail-under 80 --delay 2.0
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: sqlite:///./dentalai.db
