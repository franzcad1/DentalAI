name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations (offline check)
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_test.db

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/test_logging.py tests/test_agent_tools.py tests/test_health.py -v
